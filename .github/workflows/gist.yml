name: update gist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Build and run from this repository
        run: mise run start
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIE }}
          DAYS: ${{ vars.DAYS }}
          TOP_N: ${{ vars.TOP_N }}

  # GitHub disables a schedule after 60 days without repository activity;
  # enabling the workflow again resets that clock without a commit.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Keep the schedule enabled
        run: |
          gh api -X PUT \
            "repos/$GITHUB_REPOSITORY/actions/workflows/gist.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
