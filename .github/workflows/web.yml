name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "mise.toml"
      - ".github/workflows/web.yml"
  push:
    branches: [master]
    paths: ["apps/web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: npm ci
      - run: npm test
      # The Worker reads the new schema as soon as it deploys, so the
      # migrations land first. Migrations only add, so old code keeps working.
      - run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Worker secrets kept as repository secrets ride along with the deploy.
      # An unset one is left out, and a deploy never deletes a Worker secret.
      - run: |
          node -e '
            const names = ["GOOGLE_CLIENT_SECRET"];
            const set = names.filter((name) => process.env[name]);
            const secrets = Object.fromEntries(set.map((name) => [name, process.env[name]]));
            process.stdout.write(JSON.stringify(secrets));
          ' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
